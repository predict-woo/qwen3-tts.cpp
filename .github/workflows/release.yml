name: Release builds

on:
  push:
    # ci/release-builds is included during Task 4 validation; remove before merging to main.
    branches: [main, ci/release-builds]
    tags: ['v*']
  workflow_dispatch:

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_tag: ${{ steps.v.outputs.is_tag }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  build:
    needs: compute-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, backend: cpu,    name: linux-cpu }
          - { os: ubuntu-latest, backend: vulkan, name: linux-vulkan }
          - { os: ubuntu-latest, backend: cuda,   name: linux-cuda }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.compute-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential zip

      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux' && matrix.backend == 'vulkan'
        run: |
          set -e
          . /etc/os-release
          echo "Ubuntu codename: $UBUNTU_CODENAME"
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo gpg --dearmor -o /usr/share/keyrings/lunarg.gpg
          echo "deb [signed-by=/usr/share/keyrings/lunarg.gpg] https://packages.lunarg.com/vulkan/ ${UBUNTU_CODENAME}-backports main" | sudo tee /etc/apt/sources.list.d/lunarg-vulkan.list
          if sudo apt-get update && sudo apt-get install -y vulkan-sdk glslc libvulkan1 vulkan-tools; then
            echo "Vulkan SDK installed via apt"
          else
            echo "apt install failed; falling back to tarball SDK"
            sudo rm -f /etc/apt/sources.list.d/lunarg-vulkan.list
            sudo apt-get update || true
            sudo apt-get install -y libvulkan1 vulkan-tools glslang-tools
            mkdir -p "$HOME/vulkan-sdk"
            wget -qO /tmp/vulkan-sdk.tar.xz https://sdk.lunarg.com/sdk/download/latest/linux/vulkansdk-linux-x86_64.tar.xz
            tar -xJf /tmp/vulkan-sdk.tar.xz -C "$HOME/vulkan-sdk" --strip-components=1
            SDK_VER=$(ls "$HOME/vulkan-sdk" | head -1)
            echo "VULKAN_SDK=$HOME/vulkan-sdk/$SDK_VER/x86_64" >> "$GITHUB_ENV"
            echo "$HOME/vulkan-sdk/$SDK_VER/x86_64/bin" >> "$GITHUB_PATH"
          fi

      - name: Install CUDA Toolkit
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.5.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust"]'
          linux-local-args: '["--toolkit"]'

      - name: Configure ggml
        shell: bash
        run: |
          FLAGS="-DCMAKE_BUILD_TYPE=Release"
          case "${{ matrix.backend }}" in
            cpu)    : ;;
            vulkan) FLAGS="$FLAGS -DGGML_VULKAN=ON" ;;
            cuda)   FLAGS="$FLAGS -DGGML_CUDA=ON" ;;
            metal)  FLAGS="$FLAGS -DGGML_METAL=ON" ;;
          esac
          cmake -S ggml -B ggml/build $FLAGS

      - name: Build ggml
        run: cmake --build ggml/build --config Release -j

      - name: Configure project
        shell: bash
        run: |
          FLAGS="-DCMAKE_BUILD_TYPE=Release"
          if [ "${{ runner.os }}" != "macOS" ]; then
            FLAGS="$FLAGS -DQWEN3_TTS_COREML=OFF"
          fi
          cmake -S . -B build $FLAGS

      - name: Build project
        run: cmake --build build --config Release -j --target qwen3-tts-cli qwen3-tts-quantize

      - name: Bundle CUDA runtime libs (Linux)
        if: runner.os == 'Linux' && matrix.backend == 'cuda'
        shell: bash
        run: |
          mkdir -p cuda-runtime
          for lib in libcudart.so libcublas.so libcublasLt.so; do
            # Follow the versioned symlink chain and copy the concrete .so
            for f in /usr/local/cuda/lib64/${lib}*; do
              [ -e "$f" ] || continue
              cp -P "$f" cuda-runtime/ || true
            done
          done
          ls -la cuda-runtime/

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PKG="qwen3-tts-${VERSION}-${{ matrix.name }}"
          mkdir -p "dist/$PKG/examples" "dist/$PKG/scripts"
          cp build/qwen3-tts-cli      "dist/$PKG/"
          cp build/qwen3-tts-quantize "dist/$PKG/"
          # GGML runtime shared libs (if any — static build produces none)
          find ggml/build -maxdepth 4 \( -name 'libggml*.so*' -o -name 'libggml*.dylib' \) -exec cp {} "dist/$PKG/" \; || true
          # CUDA runtime libs staged in previous step (CUDA builds only)
          if [ -d cuda-runtime ] && [ "${{ matrix.backend }}" = "cuda" ]; then
            cp -P cuda-runtime/* "dist/$PKG/" || true
          fi
          cp examples/*.wav                  "dist/$PKG/examples/"
          cp scripts/download_model.sh       "dist/$PKG/scripts/"
          cp scripts/download_model.bat      "dist/$PKG/scripts/"
          cp .github/packaging/README.txt    "dist/$PKG/"
          cp LICENSE                         "dist/$PKG/"
          chmod +x "dist/$PKG/scripts/download_model.sh"
          chmod +x "dist/$PKG/qwen3-tts-cli" "dist/$PKG/qwen3-tts-quantize"
          cd dist && zip -r "${PKG}.zip" "$PKG"
          ls -la "${PKG}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-tts-${{ env.VERSION }}-${{ matrix.name }}
          path: dist/qwen3-tts-${{ env.VERSION }}-${{ matrix.name }}.zip
          retention-days: 14
          if-no-files-found: error
